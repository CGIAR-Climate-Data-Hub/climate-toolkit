site_name: Climate Toolkit
site_description: Location-based climate, season, climatology, hazard, and projection analysis.
site_url: https://CGIAR-Climate-Data-Hub.github.io/climate-toolkit/
repo_url: https://github.com/CGIAR-Climate-Data-Hub/climate-toolkit
repo_name: CGIAR-Climate-Data-Hub/climate-toolkit

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_description: Analyse du climat, des saisons, des aléas et des projections climatiques pour un site donné.
          theme:
            palette:
              - toggle:
                  name: Activer le mode sombre
              - toggle:
                  name: Activer le mode clair
          nav_translations:
            Home: Accueil
            About: À propos
            Getting started: Premiers pas
            Use as a package: Utiliser le paquet Python
            Datasets: Jeux de données
            Direct cloud access: Accès direct aux données cloud
            Outputs by module: Résultats par module
            Workflows: Guides pratiques
            End-to-end example: Exemple de bout en bout
            Weather stations: Stations météorologiques
            Human heat stress: Stress thermique chez l’être humain
            Livestock heat (THI): Stress thermique du bétail (THI)
            Distribution & releases: Distribution et versions
            Python API: API Python
            Overview: Vue d’ensemble
            Fetching data: Téléchargement des données
            Analysis: Analyse
            Comparison & validation: Comparaison et validation
        - locale: es
          name: Español
          build: true
          site_description: Análisis del clima, las temporadas, los riesgos y las proyecciones climáticas para un sitio determinado.
          theme:
            palette:
              - toggle:
                  name: Activar el modo oscuro
              - toggle:
                  name: Activar el modo claro
          nav_translations:
            Home: Inicio
            About: Acerca de
            Getting started: Primeros pasos
            Use as a package: Uso del paquete de Python
            Datasets: Conjuntos de datos
            Direct cloud access: Acceso directo a datos en la nube
            Outputs by module: Resultados por módulo
            Workflows: Guías prácticas
            End-to-end example: Ejemplo de principio a fin
            Weather stations: Estaciones meteorológicas
            Human heat stress: Estrés térmico en personas
            Livestock heat (THI): Estrés térmico en el ganado (THI)
            Distribution & releases: Distribución y versiones
            Python API: API de Python
            Overview: Descripción general
            Fetching data: Descarga de datos
            Analysis: Análisis
            Comparison & validation: Comparación y validación
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source
            separate_signature: true
            line_length: 60

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - About: about.md
  - Getting started: getting_started.md
  - Use as a package: use-as-a-package.md
  - Datasets: datasets.md
  - Direct cloud access: direct_cloud_access.md
  - Outputs by module: outputs_by_module.md
  - Workflows:
      - End-to-end example: example_workflow.md
      - Weather stations: weather_station_workflows.md
      - Human heat stress: human_heat_workflow.md
      - Livestock heat (THI): thi_workflow.md
      - Distribution & releases: distribution_workflow.md
  - Python API:
      - Overview: api/index.md
      - Fetching data: api/fetching.md
      - Analysis: api/analysis.md
      - Comparison & validation: api/comparison.md
