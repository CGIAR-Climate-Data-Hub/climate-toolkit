name: Publish to PyPI

# Publishes a new release to PyPI automatically whenever you publish a GitHub
# Release. Flow for each new version:
#   1. bump `version` in pyproject.toml (PyPI versions are immutable — a new
#      upload always needs a new version number),
#   2. merge to main,
#   3. draft & publish a GitHub Release (tag e.g. `v0.1.0`).
# This workflow then builds the sdist+wheel and uploads them to PyPI via
# Trusted Publishing (OIDC) — no API tokens are stored anywhere.
#
# ONE-TIME SETUP (on PyPI, by a maintainer — cannot be automated here):
#   PyPI → your account → Publishing → "Add a new pending publisher":
#     PyPI Project Name : climate-toolkit
#     Owner             : CGIAR-Climate-Data-Hub
#     Repository name    : climate-toolkit
#     Workflow name      : publish.yml
#     Environment name   : pypi
#   (Optionally protect the `pypi` GitHub Environment with required reviewers.)

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Verify metadata renders
        run: uvx twine check dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/climate-toolkit/
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
