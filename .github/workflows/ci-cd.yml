name: CI/CD Pipeline

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            extras: ""
          - python-version: "3.12"
            extras: "--extra cloud --extra api"

    steps:
      - uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # Install Python dependencies
      - name: Install Python dependencies with uv
        run: |
          uv sync --locked --group dev ${{ matrix.extras }}

      - name: Verify cloud dependencies are installed
        if: matrix.python-version == '3.12'
        run: uv run python -c "import zarr, icechunk, fsspec, dask.array"

      - name: Run Ruff baseline checks
        run: |
          uv run ruff check .

      - name: Build Python distribution artifacts
        run: |
          rm -rf .tmp/dist-release
          uv run python -m build --no-isolation --outdir .tmp/dist-release
          uv run twine check .tmp/dist-release/*

      # Run Python tests
      - name: Run Python tests with pytest
        run: |
          if [ -d "tests" ] && find tests -name "*.py" -type f | grep -q .; then
            uv run pytest tests/ -v --tb=short
          else
            echo "No Python test files found in tests directory"
          fi

  create-pr-to-main:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for differences
        id: check_diff
        run: |
          git fetch origin main:main
          if git diff --quiet ${{ github.ref_name }} main; then
            echo "No differences found between ${{ github.ref_name }} and main"
            echo "create_pr=false" >> $GITHUB_OUTPUT
          else
            echo "Differences found between ${{ github.ref_name }} and main"
            echo "create_pr=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_diff.outputs.create_pr == 'true'
        run: |
          prs=$(gh pr list --base main --head ${{ github.ref_name }} --json number,title,url)
          if [[ -n "$prs" && "$prs" != "[]" ]]; then
            echo "Pull request already exists. Updating existing PR..."
            echo "$prs"
            echo "Changes have been added to the current PR"
          else
            echo "Creating new pull request from ${{ github.ref_name }} to main"
            gh pr create \
              --title "PR: Staging to Main" \
              --body "Automated pull request from ${{ github.ref_name }} to main.

            All tests have passed in staging branch.

            **Changes:**
            - Latest changes from staging branch

            **Test Status:** 
            - All tests passed" \
              --base main \
              --head ${{ github.ref_name }} \
              --assignee Sammyjoseph999 \
              --reviewer Sammyjoseph999
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
