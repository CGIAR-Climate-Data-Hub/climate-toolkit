[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-toolkit"
version = "0.1.0a0"
description = "Climate toolkit for location-based climate, season, climatology, hazard, and projection analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
  "climate",
  "agriculture",
  "hazards",
  "seasonality",
  "nex-gddp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# Ranges, not exact pins: this is a library, so it must coexist with the
# host environment's packages (Colab, user projects). Exact versions for
# development live in uv.lock.
dependencies = [
  "earthengine_api>=1.5,<2",
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "Requests>=2.31,<3",
  "tabulate>=0.9,<1",
  "typer>=0.12,<1",
  "xarray>=2024.6",
  "xclim>=0.60,<1",
  "xee>=0.1,<0.2",
]

[dependency-groups]
dev = [
  "build",
  "pytest",
  "ruff",
  "setuptools>=68",
  "twine",
  "wheel",
]
docs = [
  "mkdocs-material",
  "mkdocs-static-i18n",
  "mkdocstrings[python]",
]

[project.urls]
Homepage = "https://github.com/CGIAR-Climate-Data-Hub/climate-toolkit"
Documentation = "https://CGIAR-Climate-Data-Hub.github.io/climate-toolkit/"
Repository = "https://github.com/CGIAR-Climate-Data-Hub/climate-toolkit"
Issues = "https://github.com/CGIAR-Climate-Data-Hub/climate-toolkit/issues"
Changelog = "https://github.com/CGIAR-Climate-Data-Hub/climate-toolkit/blob/main/CHANGELOG.md"

[project.scripts]
# Unified entry point: `climate-toolkit <command>` dispatches to the tools
# below. The individual `climate-toolkit-<command>` scripts are kept as
# backward-compatible aliases.
climate-toolkit = "climate_toolkit.cli:main"
climate-toolkit-fetch = "climate_toolkit.fetch_data.fetch_data:main"
climate-toolkit-gee-check = "climate_toolkit.gee_check:main"
climate-toolkit-seasons = "climate_toolkit.season_analysis.seasons:main"
climate-toolkit-seasons-ensemble = "climate_toolkit.season_analysis.ensemble:main"
climate-toolkit-stats = "climate_toolkit.climate_statistics.statistics:main"
climate-toolkit-stats-ensemble = "climate_toolkit.climate_statistics.ensemble_statistics:main"
climate-toolkit-periods = "climate_toolkit.compare_periods.periods:main"
climate-toolkit-periods-ensemble = "climate_toolkit.compare_periods.ensemble_periods:main"
climate-toolkit-hazards = "climate_toolkit.calculate_hazards.hazards:main"
climate-toolkit-hazards-ensemble = "climate_toolkit.calculate_hazards.ensemble_hazards:main"
climate-toolkit-weather-station-download = "climate_toolkit.weather_station.download:main"
climate-toolkit-weather-station-compare = "climate_toolkit.weather_station.compare:main"
climate-toolkit-compare-datasets = "climate_toolkit.compare_datasets.compare_datasets:main"
climate-toolkit-climatology = "climate_toolkit.climatology.long_term_climatology:main"
climate-toolkit-spei = "climate_toolkit.climatology.spei:main"
climate-toolkit-xclim-reference = "climate_toolkit.climatology.xclim_reference:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["climate_toolkit*"]

[tool.setuptools.package-data]
climate_toolkit = [
  "calculate_hazards/*.json",
  "data/ggcmi_phase3/*.json",
  "data/ggcmi_phase3/*.parquet",
  "fetch_data/source_data/sources/utils/*.yaml",
  "fetch_data/transform_data/*.yaml",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "build",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E701", "E702", "F401", "F541"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
